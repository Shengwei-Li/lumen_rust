[package]
name = "lumen"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A focused screen recorder for recorded lessons."
license = "MIT"

[dependencies]
windows-capture = "2.0.1"
nnnoiseless = { version = "0.5.2", default-features = false }
cpal = "0.18.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT_Direct3D11",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
debug = false

# No debug info keeps target/ small; only release builds are used.
[profile.dev]
debug = false

[features]
console = []

[patch.crates-io]
# Adds VideoEncoder::send_surface; see vendor/windows-capture/src/encoder.rs.
windows-capture = { path = "vendor/windows-capture" }
